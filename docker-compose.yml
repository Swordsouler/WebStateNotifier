# Nom du projet Compose fixé ici : il ne dépend plus du nom du dossier où le dépôt est cloné.
name: webstatenotifier

services:
  webstatenotifier:
    build:
      context: .
      dockerfile: Dockerfile
    image: webstatenotifier:latest
    container_name: webstatenotifier
    restart: unless-stopped
    env_file:
      - .env
